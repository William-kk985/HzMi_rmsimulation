# =============================================================================
# traversability_self_mask_chassis.yaml —— `robot:=chassis / chassis_boxvis` 的**自击掩膜**
#   （2026-10-30，机制与 robot11 同款；只作用于判据/限速，不动点云与 /segmentation/* 标签）
#
# 为什么需要：起伏底盘的 LiDAR 平放在车顶（livox_frame z=+0.09，车体顶面 z=+0.078）⇒
#   **车体顶面就在雷达脚下 1.2 cm**，360° 视场里必然扫到自己的车体顶面（一圈近场回波）⇒
#   `/scan` 里出现"自击残影"、前瞻判据被这些点抬高。`/scan` 侧已用 p2l 的
#   `min_height: 0.10`（laserscan_params_chassis.yaml）把车体顶面剔掉；本文件负责**判据层**。
#
# 掩膜（livox_frame，米；雷达在 base_link +0.09，车体 y 与雷达 y 同轴）：
#   · 车体 box：z = base_link −0.019..+0.078 ⇒ livox_frame −0.109..−0.012
#   · 4 轮：轮心 base_link ±0.1615 / −0.10895..+0.17205，半径 0.058、厚 0.03
#   · 地面保护：所有盒子的 z 下限抬到 **地面 + 0.03**（地面在 livox_frame = −0.188 ⇒ −0.158）
#     ⇒ 地面点（z ≈ −0.188）永远不可能被掩掉
#   · 近场死区：r_xy ≤ 0.34（车体半对角 0.32 + 余量）、z ≥ −0.158
# =============================================================================
ground_segmentation:
  ros__parameters:
    self_mask_enable: true
    self_mask_radius_m: 0.34
    self_mask_z_min_m: -0.158
    # [xmin,ymin,zmin,xmax,ymax,zmax] × 5（车体 + 4 轮）
    self_mask_boxes: [
      -0.228, -0.223, -0.158, 0.228, 0.223, -0.012,
       0.1035, -0.124, -0.158, 0.2195, -0.094, -0.072,
       0.1035, 0.157, -0.158, 0.2195, 0.187, -0.072,
      -0.2195, -0.187, -0.158, -0.1035, -0.157, -0.072,
      -0.2195, 0.094, -0.158, -0.1035, 0.124, -0.072
    ]
