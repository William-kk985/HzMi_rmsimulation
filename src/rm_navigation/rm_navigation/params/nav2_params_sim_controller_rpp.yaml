controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]
    
    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    
    # Goal checker parameters
    # ★ 2026-10-05：SimpleGoalChecker → PositionGoalChecker —— 全向车（mecanum）**没有"车头"概念**
    #   ⇒ 终点只约束位置；这同时消除了"位置到了但朝向过不了 → progress checker 判失败 → 反复恢复 → ABORT"这一失败模式。
    #   键名已核实（已装 nav2 1.1.20）：该插件只声明 xy_goal_tolerance / stateful
    #   （share/nav2_controller/plugins.xml + libposition_goal_checker.so 的编译期字面量）；
    #   yaw_goal_tolerance / path_length_tolerance 在 1.1.20 的 PositionGoalChecker 里**不存在** ⇒ 删掉/不写（写了是静默失效）。
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::PositionGoalChecker"
      xy_goal_tolerance: 0.25
    
    # 局部规划器变体：RPP（nav:=rpp，默认）
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.8
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 15.0
      allow_reversing: false

local_costmap:
  local_costmap:
    ros__parameters:
      # ★ 2026-09-24 记录：曾把这里放大到 1000.0 想绕过上游 isGoalReached() 丢弃 transformPose 失败的问题 ——
      #   「已撤销」。原因：这个值经 nav2_util::getCurrentPose() 传成了 tf2 的「等待超时」；遇到
      #   「过去的时间点」这种永远等不来的查询，会让 costmap 线程一次阻塞到超时（1000 秒），小病治成大病。
      #   真正要修的是 costmap 的 tf 摄入（见 docs/issues_and_findings.md 的 2026-09-24 条目）。
      #   ★ 2026-10-05 分层重构：本键只显式写在 rpp/mppi 两份旧 full 文件里（dwb/teb 靠 nav2 默认值
      #     0.3，见 nav2_costmap_2d/src/costmap_2d_ros.cpp:98）⇒ 归到 nav 槽位文件携带，base 不写。
      transform_tolerance: 0.3
