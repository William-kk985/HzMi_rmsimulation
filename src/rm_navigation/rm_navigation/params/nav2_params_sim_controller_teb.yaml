controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]
    
    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    
    # Goal checker parameters
    # ★ 2026-10-05：SimpleGoalChecker → PositionGoalChecker —— 全向车（mecanum）**没有"车头"概念**
    #   ⇒ 终点只约束位置；这同时消除了"位置到了但朝向过不了 → progress checker 判失败 → 反复恢复 → ABORT"这一失败模式。
    #   键名已核实（已装 nav2 1.1.20）：该插件只声明 xy_goal_tolerance / stateful
    #   （share/nav2_controller/plugins.xml + libposition_goal_checker.so 的编译期字面量）；
    #   yaw_goal_tolerance / path_length_tolerance 在 1.1.20 的 PositionGoalChecker 里**不存在** ⇒ 删掉/不写（写了是静默失效）。
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::PositionGoalChecker"
      xy_goal_tolerance: 0.25
    
    # 局部规划器变体：TEB（nav:=teb）
    # odom_topic 由 T2 统一为 /odom（bringup 已对 fast_lio/point_lio 做 remap）
    FollowPath:
      plugin: "teb_local_planner::TebLocalPlannerROS"
      odom_topic: /odom
      teb_autosize: 1.0
      dt_ref: 0.3
      dt_hysteresis: 0.1
      max_samples: 500
      global_plan_overwrite_orientation: False
      allow_init_with_backwards_motion: False
      max_global_plan_lookahead_dist: 3.0
      global_plan_viapoint_sep: 0.3
      global_plan_prune_distance: 1.0
      exact_arc_length: False
      feasibility_check_no_poses: 2
      publish_feedback: False
      max_vel_x: 0.5
      max_vel_theta: 1.5
      acc_lim_x: 2.5
      acc_lim_theta: 3.2
      footprint_model: # types: point / circular / two_circles / line / polygon
        type: "circular"
        radius: 0.2
      free_goal_vel: False
      min_obstacle_dist: 0.27
      inflation_dist: 0.6
      include_costmap_obstacles: True
      costmap_obstacles_behind_robot_dist: 1.0
      obstacle_poses_affected: 15
      weight_kinematics_nh: 1000.0
      weight_kinematics_forward_drive: 1.0
      weight_optimaltime: 1.0
      weight_obstacle: 50.0
      weight_viapoint: 1.0
      weight_adapt_factor: 2.0
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
