/**:
  ros__parameters:
    # ★ 2026-09-23（据 docs/research_p2l_scan_stall.md 的源码级考证）：
    #   target_frame 置空 ⇒ node.cpp L82 的 `if (!target_frame_.empty())` 不成立 ⇒ **根本不创建
    #   tf2 Buffer / TransformListener / MessageFilter**（L94-96 直接 registerCallback），
    #   输出帧仍是点云自带帧（L149 抄 header.frame_id = livox_frame）⇒ **输出逐字节不变**，
    #   但整类"tf2 过滤器丢消息/静默排队"的故障被移除。
    #   （本配置原来 target_frame == 点云 frame，过滤器本来短路放行，所以这是加固不是解药。）
    target_frame: ""
    transform_tolerance: 0.01
    # 显式给队列深度：原来没配 ⇒ 默认 std::thread::hardware_concurrency() = 本机 28
    # （同时作为 MessageFilter 队列与订阅 QoS 深度）⇒ 最多少排 28 帧 0.2MB 的旧数据。
    queue_size: 5
    min_height: -1.0
    max_height: 0.1
    angle_min: -3.14159   # -M_PI/2
    angle_max: 3.14159    # M_PI/2
    angle_increment: 0.0043   # M_PI/360.0
    scan_time: 0.1            # 与仿真插件/MID360 的 10Hz 一致（p2l 内部 time_increment 恒为 0）
    # ⚠️ range_min 决定"盲区"：小于它的点被**丢弃**（不是标为障碍），且该角度 bin 保持 inf、
    # 下游 inf_is_valid=true 会把它当"10m 处有回波"→ 沿射线清成 free。
    # 原 0.45 的理由是"避开 38cm 的地面最近点"，但 p2l 的输入已经是 linefit 去地面后的
    # /segmentation/obstacle，这个理由不成立；0.45 会让贴身 45cm 内既看不见又被擦成空。
    # 取 0.2：与车体半径(0.20)和 linefit 的 r_min 对齐 —— 盲区缩到车体内部（那里不可能有真障碍）。
    # ★ 2026-09-26：range_min 0.2 → 0.12。
    #   实测：车贴墙（车体半径 0.2m、雷达在车中心附近）时，墙的回波落进 range_min 以内被**丢弃**
    #   （该角度 bin 保持 inf）⇒ /scan 那个方位没有端点 ⇒ 在线图/代价图出现"缝" ⇒ 规划从缝里穿过去撞墙。
    #   判据：贴墙时该方位 inf；后退 ~30cm 后该方位出现回波。
    #   风险：可能扫到自身轮子/护板 ⇒ 若出现"贴着自己的幽灵障碍"（RViz 里车身一圈近点、车动不了），回调到 0.15 或改回 0.2。
    #   传感器自身 min_range=0.1（mid360.xacro 的 laser_min_range），所以 0.12 在能力范围内。
    # ★ 2026-09-26（第二次）：0.12 → 0.05。等于**关掉 p2l 的近距盲区** ——
    #   传感器自身 min_range=0.1（mid360.xacro），所以 <0.1 的值等价于"不过滤"。
    #   目的：判定"贴墙没回波"到底是不是 p2l 的 range_min 造成的。
    #   判据：若贴墙时该方位**仍然没有回波** ⇒ 与 range_min 无关，缺在更上游
    #   （原始点云/插件/仿真几何）—— 参见 cloud_z_profile 的 0-0.5m 桶几乎为空这个事实。
    #   风险：车身自身回波可能进入 ⇒ 若 RViz 里车身一圈近点、车动不了 ⇒ 回调 0.15/0.2。
    range_min: 0.05
    range_max: 10.0
    use_inf: true
    inf_epsilon: 1.0
