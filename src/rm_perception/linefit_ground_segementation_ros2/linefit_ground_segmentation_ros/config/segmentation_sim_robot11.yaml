# =============================================================================
# segmentation_sim_robot11.yaml —— `robot:=robot11` 槽位专用的地面分割参数（2026-10-07 Phase 3 新增）
#
# 与同目录 segmentation_sim.yaml 的关系：**逐键副本，只改一个键**（sensor_height）。
# （gravity_aligned_frame 保持 "" —— 理由见下方那段"为什么不能开"的实测）
# 默认模型/其它槽位读的仍是 segmentation_sim.yaml —— 那份**一个字节都没改**。
#
# 为什么这两个键必须跟着机器人模型走（都是**传感器几何量**，每个平台各自标定）：
#   ① sensor_height        = 雷达离地高度（0.226 → **0.2595**）
#   ② gravity_aligned_frame = 保持 ""（点云在源头已对齐；且该键在本仓有 C++ bug，见下）
#
# 相位：这是 docs/robot_models.md 的 Phase 3（§11）。判据/实测：
#   · 离线：tools/scripts/regress/robot11_livox_fov.py（视锥/自击/地面可见性）
#   · 在线：tools/scripts/regress/run_robot_model_probe.sh <tag> -- ... robot:=robot11
# 回退：去掉 robot:=robot11 ⇒ 默认模型读的仍是 segmentation_sim.yaml。
# =============================================================================
ground_segmentation:
  ros__parameters:
    n_threads: 4                # number of threads to use.

    r_min: 0.2                  # minimum point distance.
    r_max: 50                   # maximum point distance.
    n_bins: 120                 # number of radial bins.
    n_segments: 360             # number of radial segments.

    # ★★ 2026-09-22：由 0.1 收紧到 0.05。原来"离地面线 10cm 以内都算地面"，
    #   把 ≤8cm 的低矮特征（RMUL 场地的内部矮墙/挡板）一并当"地面附近"删掉了。
    #   实测（docs/debug_fastlio_cartographer.md §5.2.1，8 帧 bag）raw→障碍保留率：
    #     离地 0~3cm 0.1% / 3~8cm 2.8% / 8~15cm 59% / 15~30cm 44% / 30~60cm 93%
    #   ⚠️ 别再调更小：场地有坡道/高地，容差过小会把坡面点判成障碍（表现为车周围一圈"假障碍"）。
    max_dist_to_line: 0.05      # maximum vertical distance of point to line to be considered ground.

    # ★★ 2026-09-22（默认模型）：由 0.275 改为**实测值 0.226**。原来偏大 4.9cm ⇒ 地面线被整体抬高约 5cm，
    #   再叠加上面的 10cm 容差 ⇒ **离地 15cm 以内的东西大量被当"地面附近"删除**。
    #   实测方法：bag 里统计雷达系 z 的直方图（排除插件发的 (0,0,0) 假点），地面峰在 z = −0.226m。
    #   （URDF 几何算是 base_link+0.175 + 车高≈0.06 = 0.235m；Gazebo 里轮胎略有下沉，实测 0.226m。）
    #   ⚠️ 这是**每个平台各自标定**的量：换车/换安装位置/上实车都要重新量，不能照抄。
    # ★★ 2026-10-07 Phase 3：默认模型的 0.226 改为 **robot11 的实测值 0.2595**
    #   （几何：body_to_livox 的 z = 0.157028；地面平面 body z = −0.102499 ⇒ 离地 0.2595 m，
    #    由四个轮 mesh 最低点实测，见 docs/robot_models.md §9.4；Gazebo 实测峰见 §11）。
    #   ⚠️ `sensor_height` 的语义 = "雷达在传感器系下的地面 z 的相反数" = **雷达离地高度**
    #   （要求雷达 z 轴朝上）。robot11 的雷达**斜 30°** ⇒ 必须配下面的 gravity_aligned_frame，
    #   否则这个数没有意义（斜着量出来的"地面"是斜面）。
    #   ⚠️ 若用 launch 的 `livox_raise_m:=<h>`（B 方案：把雷达抬高 h）跑，这里必须改成
    #      0.2595 + h（实测值），否则地面线整体偏 h —— 本文件不替 launch 猜（单一真源）。
    sensor_height: 0.2595       # SIMULATION sensor height above ground (measured, robot11).
    min_slope: -0.4             # minimum slope of a ground line.
    max_slope: 0.4              # maximum slope of a ground line.
    max_fit_error: 0.05         # maximum error of a point during line fit.
    long_threshold: 1.0         # distance between points after which they are considered far from each other.
    max_long_height: 0.1        # maximum height change to previous point in long line.
    max_start_height: 0.5       # maximum difference to estimated ground height to start a new line.
    line_search_angle: 0.8      # how far to search in angular direction to find a line [rad].

    # ★★ 2026-10-07 Phase 3：**保持 "" 不变**（默认值），但理由与默认模型完全不同 ——
    #   本槽位的点云**在源头就已经重力对齐**了（见下方"为什么"），所以这里不需要、也**不能**开。
    #
    #   为什么"不能开"（这是本轮最有价值的一条实测发现）：
    #     本仓 linefit 的 gravity_aligned_frame 路径有 **C++ 级 bug**：
    #       ground_segmentation_node.cc:124  `Eigen::Affine3d tf;`  ← Eigen 的**默认构造不清零**
    #       紧接着 tf.rotate(q) ⇒ 点云被一个"垃圾矩阵 × 旋转"变换 ⇒ 全部点塌到原点附近。
    #     用最小 C++ 复现（g++ + Eigen 3.4）：
    #       `Eigen::Affine3d tf; tf.rotate(q); (tf * p)` → p = (0.1,0.2,0.3) 变成 7.5e-310（denormal）
    #       `Eigen::Affine3d::Identity()` 起步则得到正确的 (0.1, 0.323, 0.160)
    #     交叉验证（无 Gazebo，把 dump 的一帧回放给**活的** linefit 节点）：
    #       gravity_aligned_frame=""        ⇒ /segmentation/ground 3969 点/帧
    #       gravity_aligned_frame="base_link"⇒ /segmentation/ground **0 点/帧**（任意输入朝向下都是 0）
    #     ⇒ 该键在本仓**目前不可用**；而 hzmirm 槽位当年"雷达高+下视窄 ⇒ 地面分割全废"的结论里，
    #       有一部分其实是这个 bug（docs/robot_models.md §11 有诚实更正）。
    #     ⚠️ 那个文件属其它任务的目录（本主题不许改），所以我们在**仿真侧**把点云对齐：
    #       `livox_frame` 的 rpy 置 0（帧重力对齐）、30° 倾角搬到 `<gazebo><sensor><pose>`，
    #       插件把点发布在**父 link 系**（源码 axis = offset.Rot()·ray；point = range·axis）
    #       ⇒ 点云坐标 = 重力对齐、frame_id 仍是 livox_frame。物理上射线仍然真的斜 30°。
    gravity_aligned_frame: ""

    latch: false                # latch output topics or not
    visualize: false            # visualize segmentation result - USE ONLY FOR DEBUGGING

    input_topic: "/livox/lidar/pointcloud"
    obstacle_output_topic: "segmentation/obstacle"
    ground_output_topic: "segmentation/ground"