# gicp_registration —— GICP 重定位（localization:=gicp 槽）
#
# 契约（与 icp_registration / amcl / slam_toolbox / cartographer 一致，见 docs/localization_slots.md）：
#   **只发布 map→odom**（TF）；`odom→base_link` 归 LIO（+ lio_tf_adapter）；Nav2 用 base_link_fake。
#
# 初值（**ICP 族没有初值必然不收敛**，这是 localization:=icp 之前"跑起来但不可用"的根因）：
#   · /initialpose（RELIABLE，RViz 的 2D Pose Estimate）—— 语义 = **map 系下机器人位姿**（与 AMCL 相同）；
#   · 或本文件 initial_pose 参数（同样语义；RMUL2026 的 map 系 = 出生点相对系 ⇒ 出生即 [0,0,0]，
#     见 bringup_sim.launch.py 里 amcl_init_* 的注释；若换回 map/RMUL2026_world_backup.* 那种
#     世界系栅格图，出生点应给 [4.3, 3.35, 0]）；
#   · 两者都没有 ⇒ 本节点**不发 map→odom**，并在日志里每 2 s 说明一次（不静默发垃圾 TF）。
#
# 键名的核实方式（PCL 1.12.1 = 本机 libpcl-dev 1.12.1+dfsg-3build1，GICP 头文件在
# /usr/include/pcl-1.12/pcl/registration/{gicp.h,impl/gicp.hpp}）；"setXxx" 一律落成 "xxx"：
#   voxel_leaf_size              本节点自有（**先验地图 / GICP target** 的体素下采样 leaf；
#                                键名保持不变以兼容既有 launch/覆盖，2026-10-05 起只作用于地图侧：0.25→0.10）
#   voxel_leaf_size_scan         本节点自有（**实时点云 / GICP source** 的体素下采样 leaf；2026-10-05 新增，
#                                默认 0.05 —— 与 voxel_leaf_size 构成"两级下采样"，recipe 来自 COD 2025
#                                small_gicp_relocalization 的 global_leaf_size / registered_leaf_size）
#   max_correspondence_distance  → setMaxCorrespondenceDistance → corr_dist_threshold_
#                                （impl/gicp.hpp:414 用它当距离门限；构造默认 5.0 m，本节点 1.0→1.5）
#   maximum_iterations           → setMaximumIterations → max_iterations_
#                                （impl/gicp.hpp:496 的收敛判据之一；构造默认 200，本节点 32→16 省 CPU，
#                                 2026-10-05；依据与"精度退化就回 32"见本键的注释）
#   transformation_epsilon       → setTransformationEpsilon（impl/gicp.hpp:474-483 的平移部分）
#   rotation_epsilon             → setRotationEpsilon（同上，旋转部分；GICP 特有的"两段式"收敛判据）
#   correspondence_randomness    → setCorrespondenceRandomness → k_correspondences_
#                                （impl/gicp.hpp:51-125 算协方差的 KNN 数；构造默认 20）
#   maximum_optimizer_iterations → setMaximumOptimizerIterations → max_inner_iterations_
#                                （BFGS 内层迭代上限；构造默认 20）
#   backend / small_gicp_num_threads —— 本节点自有（2026-10-05 新增）：选配准后端（pcl | small_gicp）
#                                与 small_gicp 的 OpenMP 线程数；backend=pcl 时后者无效。见下方该键的注释。
#   publish_rate_hz / tf_lookahead_sec / fitness_score_warn / max_fitness_score /
#   no_improve_cycles_warn / stale_warn_sec / use_initial_pose —— 本节点自有（输出、时间戳与健康判定）；
#   tf_lookahead_sec 是 nav2 互操作参数（≈ AMCL transform_tolerance），依据见文件末尾该键的注释。
#
# ⚠️ 两个候选键**已核实对本节点无效，故意不写**（写了是静默失效，与 nav2 "Jazzy 键不声明" 同一个坑）：
#   euclidean_fitness_epsilon —— PCL 1.12.1 里只被 IterativeClosestPoint / JointIterativeClosestPoint
#       的 convergence_criteria 消费（impl/icp.hpp:157、impl/joint_icp.hpp:140）；GICP **覆写**了
#       computeTransformation（impl/gicp.hpp:390），收敛判据是 max_iterations_ + transformation/
#       rotation_epsilon（impl/gicp.hpp:496）⇒ 设了也不影响收敛。
#   use_reciprocal_correspondences（任务书里写作 set_use_reciprocal_correspondences）—— PCL 只在
#       IterativeClosestPoint::determineCorrespondences 里读它（impl/icp.hpp:180）；GICP 自己找最近邻
#       （impl/gicp.hpp:438 的 searchForNeighbors），从不读该标志 ⇒ 设了也不生效。
#   若以后升级 PCL 想启用，请先重新核源码，别直接抄。
#
# 点类型：pcl::PointXYZ（见 include/gicp_registration/gicp_registration.hpp 顶部说明）——
#   GICP 的协方差由 KNN 邻域自行算出（只读 x/y/z），normal/intensity 字段一律不读；
#   我们的 PCD 资产字段不统一（RMUC.pcd 没有 intensity）⇒ PointXYZ 三种资产都能读。
/gicp_registration:
  ros__parameters:
    use_sim_time: false                  # launch 注入覆盖（bringup_sim.launch.py 的 use_sim_time）
    pcd_path: ""                         # launch 注入 <rm_nav_bringup>/PCD/<world>.pcd
    map_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"           # 只用于把 /initialpose/initial_pose/~/pose 换算到 base；
                                         # **绝不发布 odom→base_link**
    laser_frame_id: "livox_frame"        # 仅当点云 header.frame_id 为空时兜底
    pointcloud_topic: "/livox/lidar/pointcloud"   # 订阅用 SensorDataQoS(BEST_EFFORT)

    # ---------- 初值 ----------
    use_initial_pose: true               # true = 用 initial_pose 参数做启动初值（/initialpose 始终有效）
                                         # false = 恒等 map→odom 起步（把 LIO 的 odom 当绝对位姿）
    initial_pose: [0.0, 0.0, 0.0]        # map 系机器人位姿 [x,y,z(,roll,pitch,yaw)]；RMUL2026 出生即原点

    # ---------- GICP ----------
    # ★★ 两级下采样 leaf（two-tier；2026-10-05 按 COD 2025 relocalizer 的 recipe 改）——
    #   对照实现：COD 的 `small_gicp_relocalization`，其参数为
    #     num_threads 8（本节点是单线程 PCL，无此键）
    #     global_leaf_size 0.25      = **先验 PCD** 的下采样 leaf（粗）
    #     registered_leaf_size 0.05  = **实时点云** 的下采样 leaf（细）
    #     max_dist_sq 2.5            = 对应点距离门限的**平方**（√2.5 ≈ 1.58 m）
    #   为什么必须分两级 + 为什么我们地图侧取 0.10 而不是照抄 0.25：
    #     · 地图（target）侧：0.25 m 时 RMUL2026.pcd 只剩 **2438** 个 target 点（实测启动 banner）。
    #       GICP 的目标协方差用 KNN=20 估计，2438 点在约 12×8 m 的场地里平均间距 ~0.4 m ⇒ 邻域退化成
    #       一条线/一个面，"平面假设"失真，配准残差对单个点极敏感 ⇒ 实测 map→odom 在 30 s 窗口里漂
    #       ~8 cm（regression 判 settled=False）。收到 0.10 m 后 target 点数量级上升到 **12450**（banner
    #       实测值，×5.1），几何细节回来。COD 能直接用 0.25 是因为它的先验 PCD 密度比我们这份高一个量级。
    #     · 实时点云（source）侧：**原实现复用地图的 leaf（0.25 m）**给实时点云下采样 ⇒ 单帧被砍到
    #       几百点，等于自己把配准精度掐死。改成 0.05 m（= COD registered_leaf_size）保住单帧几何。
    #     · 代价（本机**单节点实测**，target 12450 + source 3701 点）：首个 align 2296 ms（含目标协方差
    #       预计算），其后每帧 **327~389 ms**（更早一次实测到 570 ms）。align 原来跑在单线程 executor 里 ⇒ 50 Hz 的 TF 定时器被它
    #       阻塞（同一次实测里 `/tf` 的 map→odom 实际只有 2.3 Hz）⇒ 若整栈再出现
    #       "extrapolation into the future" 或 "Control loop missed its desired rate"，**回退阶梯**：
    #       ① `voxel_leaf_size_scan` 0.05→0.10（先牺牲实时点云精度，保住地图侧的精度收益）
    #       ② `maximum_iterations` 16→8（精度优先的话反过来回 32） ③ 最后才把 `voxel_leaf_size` 回 0.25。
    #       （COD 的对策是 small_gicp 的 `num_threads: 8` 多线程；本节点是单线程 PCL GICP，无此档。）
    #       **2026-10-05 已治本**：TF 定时器搬进独立回调组 + MultiThreadedExecutor（见 CMakeLists.txt）
    #       ⇒ 实测 /tf 从 ~2 Hz 回到 ~50 Hz；上面这条阶梯只剩"整栈总算力不够"时才需要用。
    #       align 耗时（ms）与两个 leaf、两侧点数都每 ~1 s 打在 [status] 行，先看那一行再调。
    #     · 两个 leaf 都必须 > 0（<=0 判非法并退回默认值；本节点**不提供**"0 = 不下采样"档：不采样会
    #       让单帧点数/协方差计算量失控）。
    #   回退：本键 0.10 → 0.25、voxel_leaf_size_scan 删除（或 = voxel_leaf_size）、
    #        max_correspondence_distance 1.5 → 1.0，即恢复到本次改动之前。
    voxel_leaf_size: 0.10                # m；**先验地图 / GICP target** 的体素 leaf（键名兼容旧配置；0.25→0.10）
    voxel_leaf_size_scan: 0.05           # m；**实时点云 / GICP source** 的体素 leaf（新增，= COD registered_leaf_size 0.05）
    max_correspondence_distance: 1.5     # m；1.0→1.5，对齐 COD max_dist_sq 2.5（√2.5≈1.58 m），给初值更多收敛余量。
                                         #    注意 getFitnessScore 的球半径同步从 1.0 m 变成 1.5 m（2.25 m² 门限）
                                         #    ⇒ 下面两个 fitness 阈值要按**实测量级**重看，别直接沿用旧经验值
    # ★ 2026-10-05：maximum_iterations 32 → 16。背景与依据（本机**单节点**实测，不启 Gazebo/nav2；
    #   target 12450 / source 3701 点，同一合成扫描、注入 (+0.15,-0.15) m 偏移）：
    #   · 098078d 把两级 leaf 收到 0.10/0.05 后，32 次迭代的稳态 align = **327~389 ms**（首个 align
    #     2460 ms，含目标协方差预计算）—— 单帧太贵，且在（原来的）单线程 executor 里饿死 50 Hz 的
    #     TF 定时器：实测 `/tf` 的 map→odom 只剩 **2.3 Hz** ⇒ nav2 又见 "Lookup would require
    #     extrapolation into the future"。**"饿死"是由多线程 executor + 独立回调组治本的**
    #     （见 CMakeLists.txt 的 EXECUTOR MultiThreadedExecutor 与 src/gicp_registration.cpp 的
    #     tf_cb_group_ / align_cb_group_：实测 /tf 2.3 Hz → **50.0 Hz**）。
    #   · 本键 32 → 16 的**实测**结果（别把它当成"单帧成本砍半"——不是）：
    #     同一扫描下 maximum_iterations = 1 / 4 / 16 / 32 / 64 的 align 分别是 363 / 475 / 486 /
    #     471 / 427 ms（噪声量级、非单调；1 次反而最快），fitness 全部 0.00123 m²、~/converged 全 true。
    #     原因（PCL 1.12.1 impl/gicp.hpp:420 的 `while (!converged_)` + :496 的收敛判据）：外层每次迭代做一次
    #     **BFGS 求解**（内层上限 = maximum_optimizer_iterations=20，`rigid_transformation_estimation_`），
    #     而收敛判据是 `nr_iterations_ >= max_iterations_ || delta < 1`（delta 由 transformation_epsilon/
    #     rotation_epsilon 加权）⇒ **在"上一帧已收敛 + 初值来自里程计递推"的跟踪场景里，delta 判据
    #     远早于 16 次就成立，上限根本不生效**；每帧成本由固定开销（源协方差 KNN、最近邻配对、
    #     getFitnessScore）主导。GICP 通常 10~20 次内收敛（PCL 构造默认 200，本节点一直在省 CPU）。
    #   · 那为什么还改成 16：① 上限低于实际需要 ≠ 更差或更慢（实测 fitness/converged 与 32 完全一致）；
    #     ② 在"初值差、需要更多迭代才收敛"的场景（重定位、被搬动、/initialpose 给错）它给单帧耗时
    #     封顶，避免偶尔出现更大的尖峰。**若精度退化**（`ros2 topic echo
    #     /gicp_registration/fitness_score` 量级变差、~/converged 掉 false、[status] 采纳率下降）
    #     **直接调回 32** —— 这是纯 CPU↔精度交换，没有别的副作用。
    maximum_iterations: 16               # PCL GICP 构造默认 200；32→16（2026-10-05；实测上限不生效，精度退化就回 32）
    transformation_epsilon: 5.0e-4       # = PCL GICP 构造默认
    rotation_epsilon: 2.0e-3             # = PCL GICP 构造默认
    correspondence_randomness: 20        # = PCL GICP 构造默认（算协方差的 KNN 数）
    maximum_optimizer_iterations: 20     # = PCL GICP 构造默认（BFGS 内层）

    # ---------- 配准后端（2026-10-05 新增） ----------
    # backend = 用哪个 GICP 实现做"目标预处理 + 单帧 align + 评分"：
    #   "pcl"        = pcl::GeneralizedIterativeClosestPoint（**默认**；两级 leaf 0.10/0.05 下
    #                  单帧 align 实测 327~389 ms **单线程**，是我们剩余 CPU 压力
    #                  "Control loop missed its desired rate of 30 Hz" 的来源之一）。
    #   "small_gicp" = vendored koide3/small_gicp（MIT，pinned commit 57c1106daf83c2c79ee0c58a9c7ed0032298ff4e
    #                  = tag v1.0.1；OpenMP 多线程 GICP，同一算法）。COD 2025 战队的
    #                  `small_gicp_relocalization` 用的就是这个后端（其 num_threads: 8）。
    # 为什么默认仍是 pcl：现有 fitness 阈值（fitness_score_warn 0.05 / max_fitness_score 0.3）、
    #   tf_lookahead_sec=0.45 与整栈行为都是按 PCL 路径**实测标定**的 ⇒ 换默认值等于换一个未验证的
    #   定位栈。先 A/B，再决定是否改默认。
    # 实测 A/B（同一合成扫描：PCD/RMUL2026.pcd 抽 4000 点 + 注入 (+0.15,-0.15) m、
    #   target 12450 / source 3701 点、同一批帧）：见 docs/gicp_backend_small_gicp.md 的表。
    # ★ 契约不变：无论选哪个后端，都只发 map→odom、都用 now+tf_lookahead_sec 盖戳、
    #   都保持"没有初值就不发 TF"、~/fitness_score 都表示**内点平均平方距离（m²）**
    #   （small_gicp 的原生 error 是 Mahalanobis 加权残差和，另发在 ~/small_gicp_error，
    #     **不要**拿它去比 fitness 阈值）。
    # 回退：本键改回 "pcl"（或运行时 --ros-args -p backend:=pcl）即可逐字节回到旧行为；
    #   整包回退 = git revert 引入 small_gicp 的那一个 commit（third_party/small_gicp 一并移除）。
    backend: "pcl"                       # pcl | small_gicp
    small_gicp_num_threads: 4            # 仅 backend=small_gicp 生效（OpenMP 线程数；COD 用 8，本机实测见 docs）
                                         # 注意：本节点跑 MultiThreadedExecutor，但 align 回调组是
                                         # MutuallyExclusive ⇒ 同时只有一个 align；这 4~8 个线程只在
                                         # 单帧 align 内部并行。整栈同机（Gazebo+nav2+LIO）时别拉满核。

    # ---------- 输出与健康 ----------
    publish_rate_hz: 50.0                # TF map→odom 的发布频率（与配准帧率无关）
                                         # ★ 2026-10-05：这个 50 Hz 原来只是"名义值"——单线程 executor 下
                                         #   被 350 ms 的 align 饿死（`ros2 topic hz /tf` 实测 ~2 Hz，
                                         #   TF 条数 ≈ 采纳帧数）⇒ nav2 的 extrapolation 根因。现在定时器
                                         #   独占 tf_cb_group_ + MultiThreadedExecutor（CMakeLists.txt
                                         #   的 EXECUTOR MultiThreadedExecutor）⇒ 实测 ~50 Hz，
                                         #   align 多慢都不影响 TF 的发布节奏。
    # ★ 时间戳前瞻（秒）—— 与 AMCL 的 transform_tolerance **同语义**：把 map→odom（和 ~/pose）
    #   盖成 now + tf_lookahead_sec 的时间戳，而不是"当前/点云时间戳"。
    #   为什么必须有：nav2 的消费者**不在"此刻"查 map→odom**，而是在 now + transform_tolerance
    #   那一档查（本仓库 FollowPath.transform_tolerance=0.1，MPPI 的 transformPose 用它做 tf2 前瞻）。
    #   2026-10-05 实跑 localization:=gicp 的日志逐条是 requested = 最新数据 + 0.100 s：
    #     [controller_server] Exception in transformPose: Lookup would require extrapolation into the
    #       future. Requested time 654.682000 but the latest data is at time 654.582000,
    #       when looking up transform from frame [odom] to frame [map]
    #     ⇒ Unable to transform robot pose into global plan's frame ⇒ [follow_path] Aborting handle
    #     ⇒ 每周期 abort + BT 反复恢复（behavior_server 的 Spin/BackUp 也超时）⇒ 导航卡死。
    #   AMCL 之所以从不报这个错：transform_tolerance 让 AMCL 也把 map→odom 盖成**未来**戳
    #   （本仓库 amcl transform_tolerance=0.3，见 nav2_params_sim_base.yaml）。
    #   过小 ⇒ 复现上面的 "extrapolation into the future"；
    #   过大 ⇒ 位姿被外推过头（车按 2 m/s 跑 0.3 s ≈ 0.6 m 的"提前量"，本质是拿旧位姿外推），
    #          高速/转弯时表现为定位滞后→猛修正→来回抖（与 2026-10-05 把 amcl
    #          transform_tolerance 从 1.0 收到 0.3 是同一个理由）。
    #   调法：**≥ 消费端最大的 transform_tolerance + 一个发布周期**（50 Hz ⇒ 20 ms 抖动）。
    #   2026-10-05 用 tf2 探针实测（不启 Gazebo，只跑本节点）：tf_lookahead_sec=0.0 时
    #   "now+0.00…+0.40 s" 的查询**全部**抛 extrapolation（= 现状 bug）；= 0.3 时
    #   now+0.00/0.05/0.10/0.20 全部成功（覆盖本仓库 MPPI 的 0.1 前瞻，余量 0.2 s），
    #   而 now+0.30（正好等于 lookahead）仍可能因"最新条目比查询时刻旧 ~1~20 ms"而失败 ——
    #   这正是"要留一个发布周期"的原因（AMCL 用同样的语义，边界情形同理）。
    # ★ 2026-10-05：0.3 → 0.45。依据实跑日志：extrapolation 报错全部紧挨着 "Control loop missed its
    #   desired rate of 30 Hz"（CPU 过载 ⇒ 本节点 50 Hz 的 TF 定时器被饿死，某一瞬间最新 TF 落后于
    #   消费者请求的 now+0.1）⇒ 0.3 的余量顶不住最坏掉帧。0.45 只是给"发布被饿死"留余量，
    #   TF 的【值】仍是最新估计（50 Hz ⇒ 最多旧 20 ms），不是把位姿往前外推。
    #   规则：≥ 消费端最大 transform_tolerance（costmap 0.3）+ 发布周期 + 最坏掉帧余量。
    #   回退：改回 0.3（会重新出现零星 abort）。
    tf_lookahead_sec: 0.45
    fitness_score_warn: 0.05             # m²；= 内点平均平方距离（RMS≈0.22 m）。超过 ⇒ ~/converged=false
                                         # ★ 2026-10-05：max_correspondence_distance 1.0→1.5 后，评分球半径从
                                         #   1.0 m 变成 1.5 m（门限 1.0→2.25 m²）⇒ 同一场景的 score 会整体上移，
                                         #   本键与 max_fitness_score **未随本次改动调整**（保持可 A/B），
                                         #   实跑后按 `ros2 topic echo /gicp_registration/fitness_score` 的量级重定
    max_fitness_score: 0.3               # m²；超过就**拒绝**本帧结果（RMS≈0.55 m）。首跑按实测再收紧
    no_improve_cycles_warn: 10           # 连续多少帧未采纳后打一条"定位已失效"的醒目 WARN
    stale_warn_sec: 3.0                  # 多久没收到点云就 WARN（定位停止更新）
